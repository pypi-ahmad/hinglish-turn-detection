# Fast pipeline smoke-test config: NOT one of the ablation experiments in
# docs/02_experiment_plan.md. Same architecture/data settings as
# baseline.yaml but a single epoch and a smaller batch, purely to verify the
# full train.py loop (data loading -> augmentation -> forward -> backward ->
# AMP -> checkpointing -> eval -> latency benchmark) runs end-to-end without
# error before committing GPU time to the real ablation matrix.

experiment_name: smoke_test

model:
  base_model_name: openai/whisper-tiny
  pooling: attention
  freeze_encoder_layers: 0

data:
  use_augmentation: true
  augment_config:
    p_silence: 0.3
    p_speed: 0.3
    p_pitch: 0.2
    p_noise: 0.2
    p_volume: 0.3
    p_filler: 0.35
    silence_ms_range: [100, 800]
  use_hard_negatives: true
  hard_negative_oversample_weight: 3.0

training:
  batch_size: 8
  grad_accum_steps: 2
  eval_batch_size: 8
  learning_rate: 5.0e-5
  num_epochs: 1
  warmup_ratio: 0.2
  weight_decay: 0.01
  lr_scheduler: cosine
  grad_clip_norm: 1.0
  mixed_precision: fp16
  seed: 42

evaluation:
  metrics: [accuracy, precision, recall, f1, auc, false_complete_rate]

checkpoint:
  dir: checkpoints/smoke_test
  select_by: val_f1
